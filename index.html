<!DOCTYPE html>
<html lang="zh-TW" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="J.Law Notepad" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>J.Law Notepad</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 128 128'%3E%3Crect width='128' height='128' rx='24' fill='%233b82f6'/%3E%3Cpath fill='white' d='M36 28h56a8 8 0 018 8v56a8 8 0 01-8 8H36a8 8 0 01-8-8V36a8 8 0 018-8zm8 20v8h40v-8H44zm0 20v8h32v-8H44z'/%3E%3C/svg%3E" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            primary: { 500: '#3b82f6', 600: '#2563eb', 700: '#1d4ed8' },
            surface: { DEFAULT: '#0f172a', panel: '#1e293b', card: '#1e293b' }
          },
          fontFamily: {
            sans: ['Inter', 'Microsoft JhengHei', 'PingFang TC', 'Noto Sans TC', 'system-ui', 'sans-serif']
          }
        }
      }
    };
  </script>
  <style>
    :root {
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-left: env(safe-area-inset-left, 0px);
      --safe-right: env(safe-area-inset-right, 0px);
      --app-vh: 100dvh;
      --kb: 0px;
    }
    html, body {
      height: 100%;
      height: 100dvh;
      margin: 0;
      overscroll-behavior: none;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      font-family: Inter, "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", system-ui, sans-serif;
    }
    body {
      padding: var(--safe-top) var(--safe-right) var(--safe-bottom) var(--safe-left);
      background: #f8fafc;
      color: #0f172a;
    }
    html.dark body { background: #0f172a; color: #f1f5f9; }

    /* ===== App shell ===== */
    #app {
      height: calc(var(--app-vh) - var(--safe-top) - var(--safe-bottom));
      max-height: calc(var(--app-vh) - var(--safe-top) - var(--safe-bottom));
      display: flex;
      overflow: hidden;
      position: relative;
    }

    /* Mobile: single pane. Desktop: split */
    #listPane, #editorPane {
      display: flex;
      flex-direction: column;
      min-height: 0;
      min-width: 0;
      background: inherit;
    }
    #listPane {
      width: 100%;
      flex: 1;
    }
    #editorPane {
      display: none;
      width: 100%;
      flex: 1;
      position: absolute;
      inset: 0;
      z-index: 20;
      background: #f8fafc;
    }
    html.dark #editorPane { background: #0f172a; }
    body.mode-editor #editorPane { display: flex; }
    body.mode-editor #listPane { display: none; }

    @media (min-width: 1024px) {
      #listPane {
        width: 22rem;
        max-width: 22rem;
        flex: 0 0 22rem;
        display: flex !important;
        border-right: 1px solid #e2e8f0;
      }
      html.dark #listPane { border-color: #1e293b; }
      #editorPane {
        position: static;
        display: flex !important;
        flex: 1;
        z-index: 1;
      }
      body.mode-list #editorPane { display: flex !important; }
      body.mode-list #listPane { display: flex !important; }
    }

    /* Scroll areas */
    .scroll-y {
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior-y: contain;
    }
    .scroll-x {
      overflow-x: auto;
      overflow-y: hidden;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .scroll-x::-webkit-scrollbar { display: none; }

    /* Note cards */
    .note-card {
      display: flex;
      align-items: flex-start;
      gap: 0.5rem;
      padding: 0.875rem 1rem;
      border-radius: 0.875rem;
      border: 1px solid transparent;
      transition: background .15s, border-color .15s;
      min-height: 3.5rem;
      -webkit-user-select: none;
      user-select: none;
    }
    .note-card:active { background: rgba(59,130,246,.08); }
    .note-card.active {
      background: rgba(59,130,246,.12);
      border-color: rgba(59,130,246,.35);
    }
    html.dark .note-card:active { background: rgba(59,130,246,.15); }
    html.dark .note-card.active {
      background: rgba(59,130,246,.18);
      border-color: rgba(59,130,246,.4);
    }
    .note-card .actions {
      display: flex;
      gap: 0.15rem;
      opacity: 0.55;
      flex-shrink: 0;
    }
    @media (hover: hover) {
      .note-card .actions { opacity: 0; }
      .note-card:hover .actions { opacity: 1; }
    }
    .hit {
      min-width: 2.5rem;
      min-height: 2.5rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 0.5rem;
    }

    /* Editor */
    #noteTitle {
      font-size: 1.25rem;
      font-weight: 700;
      line-height: 1.35;
      width: 100%;
      background: transparent;
      border: none;
      outline: none;
      color: inherit;
    }
    #editor {
      min-height: 40vh;
      outline: none;
      font-size: 16px; /* prevent iOS zoom */
      line-height: 1.75;
      word-break: break-word;
      padding-bottom: 6rem;
    }
    #editor:empty:before {
      content: attr(data-placeholder);
      color: #94a3b8;
      pointer-events: none;
    }
    #editor a { color: #3b82f6; text-decoration: underline; text-underline-offset: 2px; }
    html.dark #editor a { color: #60a5fa; }
    #editor img {
      max-width: 100%;
      height: auto;
      border-radius: 0.5rem;
      margin: 0.5rem 0;
      cursor: pointer;
    }
    #editor img.selected { outline: 3px solid #3b82f6; }

    /* Checklist */
    #editor .checklist-item {
      display: flex;
      align-items: flex-start;
      gap: 0.5rem;
      margin: 0.35rem 0;
      min-height: 1.75rem;
    }
    #editor .checklist-item input[type="checkbox"] {
      margin-top: 0.35rem;
      width: 1.15rem;
      height: 1.15rem;
      accent-color: #3b82f6;
      flex-shrink: 0;
    }
    #editor .checklist-item .checklist-text {
      flex: 1;
      outline: none;
      min-height: 1.5rem;
      line-height: 1.5;
    }
    #editor .checklist-item.checked .checklist-text {
      text-decoration: line-through;
      opacity: 0.55;
    }

    /* Format bar - mobile bottom sticky */
    #formatBar {
      display: flex;
      align-items: center;
      gap: 0.25rem;
      padding: 0.4rem 0.5rem;
      border-top: 1px solid #e2e8f0;
      background: rgba(248,250,252,0.92);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      flex-shrink: 0;
      padding-bottom: max(0.4rem, calc(var(--kb) * 0)); /* kb handled by pane height */
    }
    html.dark #formatBar {
      border-color: #1e293b;
      background: rgba(15,23,42,0.92);
    }
    #formatBar .fmt {
      flex-shrink: 0;
      min-width: 2.35rem;
      min-height: 2.35rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 0.5rem;
      font-size: 0.9rem;
      color: #334155;
    }
    html.dark #formatBar .fmt { color: #cbd5e1; }
    #formatBar .fmt:active, #formatBar .fmt.active {
      background: rgba(59,130,246,0.15);
      color: #2563eb;
    }
    #formatBar .sep {
      width: 1px;
      height: 1.25rem;
      background: #cbd5e1;
      margin: 0 0.2rem;
      flex-shrink: 0;
    }
    html.dark #formatBar .sep { background: #334155; }

    /* FAB */
    #fabNew {
      position: absolute;
      right: 1.1rem;
      bottom: calc(1.1rem + var(--safe-bottom));
      width: 3.5rem;
      height: 3.5rem;
      border-radius: 9999px;
      background: #2563eb;
      color: white;
      box-shadow: 0 10px 25px -5px rgba(37,99,235,0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 15;
      border: none;
    }
    @media (min-width: 1024px) {
      #fabNew { display: none; }
    }

    /* Sheets / menus */
    .sheet-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.45);
      z-index: 50;
      display: none;
    }
    .sheet-backdrop.open { display: block; }
    .action-sheet {
      position: fixed;
      left: 0; right: 0; bottom: 0;
      z-index: 51;
      background: #fff;
      border-radius: 1rem 1rem 0 0;
      padding: 0.75rem 0.75rem calc(0.75rem + var(--safe-bottom));
      transform: translateY(110%);
      transition: transform 0.25s cubic-bezier(0.16,1,0.3,1);
      max-height: 70vh;
      overflow-y: auto;
    }
    html.dark .action-sheet { background: #1e293b; }
    .action-sheet.open { transform: translateY(0); }
    .action-sheet button.row {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      width: 100%;
      text-align: left;
      padding: 0.9rem 1rem;
      border-radius: 0.75rem;
      font-size: 0.95rem;
      color: inherit;
    }
    .action-sheet button.row:active { background: rgba(148,163,184,0.15); }
    .action-sheet button.row.danger { color: #ef4444; }

    /* Image resize */
    #imgResizeOverlay {
      position: absolute;
      display: none;
      flex-wrap: wrap;
      gap: 0.25rem;
      background: rgba(255,255,255,0.95);
      border: 1px solid #e2e8f0;
      border-radius: 0.5rem;
      padding: 0.3rem;
      box-shadow: 0 8px 20px rgba(0,0,0,0.12);
      z-index: 30;
      max-width: calc(100vw - 1rem);
    }
    html.dark #imgResizeOverlay {
      background: rgba(30,41,59,0.95);
      border-color: #334155;
    }
    #imgResizeOverlay button {
      padding: 0.35rem 0.55rem;
      font-size: 0.75rem;
      border-radius: 0.35rem;
      color: #475569;
    }
    html.dark #imgResizeOverlay button { color: #cbd5e1; }
    #imgResizeOverlay button:active { background: #e2e8f0; }
    html.dark #imgResizeOverlay button:active { background: #475569; }
    #imgResizeOverlay .delete-btn { color: #ef4444; }

    /* Toast */
    #toastContainer {
      position: fixed;
      left: 50%;
      bottom: calc(1.5rem + var(--safe-bottom));
      transform: translateX(-50%);
      z-index: 100;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      pointer-events: none;
      width: min(92vw, 22rem);
      align-items: stretch;
    }
    .toast {
      pointer-events: auto;
      background: rgba(15,23,42,0.92);
      color: #fff;
      font-size: 0.8125rem;
      padding: 0.7rem 1rem;
      border-radius: 0.75rem;
      box-shadow: 0 8px 24px rgba(0,0,0,0.2);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
    }
    html.dark .toast {
      background: rgba(241,245,249,0.95);
      color: #0f172a;
    }

    /* Folder chips */
    .chip {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      padding: 0.4rem 0.7rem;
      border-radius: 9999px;
      font-size: 0.75rem;
      border: 1px solid #e2e8f0;
      background: #fff;
      color: #475569;
      white-space: nowrap;
      flex-shrink: 0;
    }
    html.dark .chip {
      background: #1e293b;
      border-color: #334155;
      color: #cbd5e1;
    }
    .chip.active {
      background: #2563eb;
      border-color: #2563eb;
      color: #fff;
    }

    /* Modal center */
    .modal-center {
      position: fixed;
      inset: 0;
      z-index: 60;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      background: rgba(0,0,0,0.45);
    }
    .modal-center.open { display: flex; }
    .modal-card {
      width: min(100%, 22rem);
      background: #fff;
      border-radius: 1rem;
      padding: 1.25rem;
      box-shadow: 0 20px 40px rgba(0,0,0,0.25);
    }
    html.dark .modal-card { background: #1e293b; }

    /* Desktop header tweaks */
    @media (min-width: 1024px) {
      #editorTopBar .back-btn { display: none !important; }
    }
  </style>
</head>
<body class="mode-list">
  <div id="app">
    <!-- ========== LIST PANE ========== -->
    <section id="listPane">
      <header class="px-4 pt-3 pb-2 flex items-center justify-between gap-2 shrink-0">
        <h1 class="text-lg font-bold bg-clip-text text-transparent bg-gradient-to-r from-blue-500 to-indigo-500 truncate">J.Law Notepad</h1>
        <div class="flex items-center gap-1">
          <button type="button" class="hit text-slate-500 dark:text-slate-300" onclick="toggleTheme()" title="主題" aria-label="主題">
            <svg id="themeIcon" width="20" height="20" fill="currentColor" viewBox="0 0 256 256"><path d="M233.54,142.23a8,8,0,0,0-8-8.18,90,90,0,0,1-74.1-74.1,8,8,0,0,0-8.18-8,106,106,0,1,0,90.28,90.28Z"></path></svg>
          </button>
          <button type="button" class="hit text-slate-500 dark:text-slate-300 hidden lg:inline-flex" onclick="createNewNote(true)" title="新增" aria-label="新增">
            <svg width="22" height="22" fill="currentColor" viewBox="0 0 256 256"><path d="M224,128a8,8,0,0,1-8,8H136v80a8,8,0,0,1-16,0V136H40a8,8,0,0,1,0-16h80V40a8,8,0,0,1,16,0v80h80A8,8,0,0,1,224,128Z"></path></svg>
          </button>
        </div>
      </header>

      <div class="px-4 pb-2 shrink-0">
        <div class="relative">
          <svg class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
          <input id="noteSearchInput" type="search" enterkeyhint="search" placeholder="搜尋筆記…"
            class="w-full pl-9 pr-3 py-2.5 rounded-xl bg-slate-100 dark:bg-slate-800/80 border-0 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/40"
            oninput="debouncedRenderList()" />
        </div>
      </div>

      <div class="px-4 pb-2 shrink-0">
        <div class="flex items-center gap-2 mb-1.5">
          <span class="text-[11px] uppercase tracking-wide text-slate-400">資料夾</span>
          <button type="button" class="ml-auto text-slate-400 hit" style="min-width:1.75rem;min-height:1.75rem" onclick="createFolder()" title="新增資料夾">+</button>
        </div>
        <div id="folderList" class="scroll-x flex gap-1.5 pb-1"></div>
      </div>

      <div id="notesList" class="scroll-y flex-1 px-3 pb-24 space-y-1"></div>

      <button type="button" id="fabNew" onclick="createNewNote(true)" aria-label="新增筆記">
        <svg width="26" height="26" fill="currentColor" viewBox="0 0 256 256"><path d="M224,128a8,8,0,0,1-8,8H136v80a8,8,0,0,1-16,0V136H40a8,8,0,0,1,0-16h80V40a8,8,0,0,1,16,0v80h80A8,8,0,0,1,224,128Z"></path></svg>
      </button>
    </section>

    <!-- ========== EDITOR PANE ========== -->
    <section id="editorPane">
      <header id="editorTopBar" class="px-2 pt-2 pb-1 flex items-center gap-1 shrink-0 border-b border-slate-200/80 dark:border-slate-800">
        <button type="button" class="back-btn hit text-blue-600 dark:text-blue-400 font-medium text-sm px-1" onclick="showListView()" aria-label="返回列表">
          <span class="inline-flex items-center gap-0.5">
            <svg width="20" height="20" fill="currentColor" viewBox="0 0 256 256"><path d="M168.49,199.51a12,12,0,0,1-17,17l-80-80a12,12,0,0,1,0-17l80-80a12,12,0,0,1,17,17L97,128Z"></path></svg>
            列表
          </span>
        </button>
        <div class="flex-1 min-w-0"></div>
        <button type="button" class="hit text-slate-500 dark:text-slate-300 text-xs px-2" onclick="openSearchModal()" title="尋找">尋找</button>
        <button type="button" class="hit text-slate-500 dark:text-slate-300" onclick="openEditorMenu()" aria-label="更多">
          <svg width="20" height="20" fill="currentColor" viewBox="0 0 256 256"><path d="M144,128a16,16,0,1,1-16-16A16,16,0,0,1,144,128ZM80,112a16,16,0,1,0,16,16A16,16,0,0,0,80,112Zm96,0a16,16,0,1,0,16,16A16,16,0,0,0,176,112Z"></path></svg>
        </button>
      </header>

      <div class="px-4 pt-3 pb-1 shrink-0">
        <input id="noteTitle" type="text" placeholder="標題" autocomplete="off"
          oninput="handleTitleInput()"
          class="placeholder:text-slate-400" />
      </div>

      <div id="editorContainer" class="scroll-y flex-1 px-4 relative min-h-0">
        <div id="editor" contenteditable="true" role="textbox" aria-multiline="true"
          data-placeholder="開始寫筆記… 可貼上文字、連結或圖片"
          oninput="handleEditorInput()" onpaste="handlePaste(event)"></div>
        <div id="imgResizeOverlay">
          <button type="button" onclick="resizeImage('25%')">25%</button>
          <button type="button" onclick="resizeImage('50%')">50%</button>
          <button type="button" onclick="resizeImage('75%')">75%</button>
          <button type="button" onclick="resizeImage('100%')">100%</button>
          <button type="button" class="delete-btn" onclick="removeSelectedImage()">刪除</button>
        </div>
      </div>

      <div id="formatBar" class="scroll-x">
        <button type="button" class="fmt" onclick="formatText('undo')" title="復原">↶</button>
        <button type="button" class="fmt" onclick="formatText('redo')" title="重做">↷</button>
        <span class="sep"></span>
        <button type="button" class="fmt font-bold" onclick="formatText('bold')">B</button>
        <button type="button" class="fmt italic" onclick="formatText('italic')">I</button>
        <button type="button" class="fmt underline" onclick="formatText('underline')">U</button>
        <button type="button" class="fmt" onclick="formatText('strikeThrough')" title="刪除線"><s>S</s></button>
        <span class="sep"></span>
        <button type="button" class="fmt" onclick="changeFontSize(1)" title="放大字">A+</button>
        <button type="button" class="fmt" onclick="changeFontSize(-1)" title="縮小字">A−</button>
        <span class="sep"></span>
        <button type="button" class="fmt" onclick="formatColor('foreColor','#ef4444')" title="紅字"><span class="w-3.5 h-3.5 rounded-full bg-red-500 inline-block"></span></button>
        <button type="button" class="fmt" onclick="formatColor('foreColor','#eab308')" title="黃字"><span class="w-3.5 h-3.5 rounded-full bg-yellow-500 inline-block"></span></button>
        <button type="button" class="fmt" onclick="formatColor('foreColor','#22c55e')" title="綠字"><span class="w-3.5 h-3.5 rounded-full bg-green-500 inline-block"></span></button>
        <button type="button" class="fmt" onclick="formatColor('foreColor','#3b82f6')" title="藍字"><span class="w-3.5 h-3.5 rounded-full bg-blue-500 inline-block"></span></button>
        <button type="button" class="fmt" onclick="formatText('hiliteColor','#fef08a')" title="螢光">螢</button>
        <span class="sep"></span>
        <button type="button" class="fmt" onclick="insertChecklist()" title="待辦">☑</button>
        <button type="button" class="fmt" onclick="openLinkModal()" title="連結">🔗</button>
        <button type="button" class="fmt" onclick="document.getElementById('imageUpload').click()" title="圖片">🖼</button>
        <input type="file" id="imageUpload" accept="image/*" class="hidden" onchange="handleImageUpload(event)" />
        <span class="sep"></span>
        <button type="button" class="fmt" onclick="formatText('removeFormat')" title="清除格式">清除</button>
      </div>

      <footer class="px-4 py-1.5 flex items-center justify-between text-[11px] text-slate-400 shrink-0 border-t border-slate-200/60 dark:border-slate-800/80">
        <span id="saveStatus">就緒</span>
        <span id="charCount">字數: 0</span>
      </footer>
    </section>
  </div>

  <!-- Editor action sheet -->
  <div id="sheetBackdrop" class="sheet-backdrop" onclick="closeSheets()"></div>
  <div id="editorSheet" class="action-sheet" role="dialog">
    <div class="w-10 h-1 rounded-full bg-slate-300 dark:bg-slate-600 mx-auto mb-3"></div>
    <button type="button" class="row" onclick="togglePinActive(); closeSheets();">📌 置頂／取消置頂</button>
    <button type="button" class="row" onclick="moveActiveNoteFolder(); closeSheets();">📁 移至資料夾</button>
    <button type="button" class="row" onclick="openExportModal(); closeSheets();">⬆️ 匯出</button>
    <button type="button" class="row" onclick="document.getElementById('fileImport').click(); closeSheets();">⬇️ 匯入 JSON</button>
    <button type="button" class="row" onclick="clearCurrentNote(); closeSheets();">🧹 清空內容</button>
    <button type="button" class="row danger" onclick="requestDeleteActive(); closeSheets();">🗑 刪除筆記</button>
    <button type="button" class="row" onclick="closeSheets();" style="justify-content:center;color:#64748b;margin-top:0.25rem">取消</button>
  </div>

        <button type="button" class="px-3 py-2 text-xs rounded-lg bg-blue-600 text-white" onclick="performReplace()">取代</button>
        <button type="button" class="px-3 py-2 text-xs rounded-lg bg-indigo-600 text-white" onclick="performReplaceAll()">全部</button>
        <button type="button" class="px-3 py-2 text-xs rounded-lg text-slate-500" onclick="closeSearchModal()">關閉</button>

  <!-- Export -->
  <div id="exportModal" class="modal-center" onclick="if(event.target===this)closeExportModal()">
    <div class="modal-card">

      <button type="button" class="row w-full text-left px-3 py-3 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-700 mb-1" onclick="exportHTML()">匯出獨立 HTML</button>
      <button type="button" class="row w-full text-left px-3 py-3 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-700 mb-1" onclick="exportCurrentNotePDF()">匯出目前筆記 PDF</button>
      <button type="button" class="w-full mt-2 py-2 text-sm text-slate-500" onclick="closeExportModal()">取消</button>

  <!-- Delete confirm -->
  <div id="deleteConfirmModal" class="modal-center">
    <div class="modal-card">
      <h3 class="font-semibold mb-1">刪除筆記？</h3>
      <p class="text-sm text-slate-500 dark:text-slate-400 mb-4">刪除後可於數秒內復原。</p>
      <div class="flex gap-2 justify-end">
        <button type="button" class="px-3 py-2 text-sm rounded-lg" onclick="closeDeleteConfirmModal()">取消</button>
        <button type="button" class="px-3 py-2 text-sm rounded-lg bg-red-600 text-white" onclick="confirmDeleteNote()">刪除</button>
      </div>
    </div>
  </div>

  <div id="toastContainer"></div>

  <script>
  (function () {
    'use strict';

    const SUPABASE_URL = 'https://wanknivxcsrasdkkxmfr.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndhbmtuaXZ4Y3NyYXNka2t4bWZyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODczMzE4NjcsImV4cCI6MjEwMjkwNzg2N30.tqsFimERtYCxoh8J-8FlqxByWtX2gNnyaGo08jditrs';
    const STORAGE_KEY = 'notepad_data_v1';
    const DATA_ROW_ID = 'main';

    let sbClient = null;
    let isOnline = navigator.onLine;
    let isSyncing = false;
    let lastCloudUpdatedAt = null;
    let realtimeChannel = null;
    let cloudSaveTimer = null;
    let localSaveTimer = null;
    let autoSaveTimer = null;

    let appState = {
      notes: [],
      folders: [],
      activeFolderId: 'all',
      activeNoteId: null,
      theme: 'dark',
      isWordWrap: true
    };
    var state = appState;

    let selectedImage = null;
    let savedSelectionRange = null;
    let noteToDeleteId = null;
    let lastDeletedNote = null;
    let lastDeletedNoteIndex = -1;
    let deleteToastTimeout = null;
    let lastClearedContent = null;
    let clearUndoTimeout = null;
    let _lastFindRange = null;
    let lastCustomColor = null;

    const editor = document.getElementById('editor');
    const editorContainer = document.getElementById('editorContainer');
    const imgResizeOverlay = document.getElementById('imgResizeOverlay');
    const noteTitleInput = document.getElementById('noteTitle');
    const notesListEl = document.getElementById('notesList');
    const saveStatusEl = document.getElementById('saveStatus');
    const charCountEl = document.getElementById('charCount');
    const noteSearchInput = document.getElementById('noteSearchInput');

    function isMobileLayout() {
      return window.innerWidth < 1024;
    }

    function showListView() {
      saveCurrentNoteState();
      document.body.classList.remove('mode-editor');
      document.body.classList.add('mode-list');
      hideImageResizeOverlay();
      closeSheets();
    }

    function showEditorView() {
      document.body.classList.remove('mode-list');
      document.body.classList.add('mode-editor');
      if (isMobileLayout()) {
        setTimeout(() => {
          try { noteTitleInput.focus(); } catch (_) {}
        }, 50);
      }
    }

    function openEditorMenu() {
      document.getElementById('sheetBackdrop').classList.add('open');
      document.getElementById('editorSheet').classList.add('open');
    }
    function closeSheets() {
      document.getElementById('sheetBackdrop').classList.remove('open');
      document.getElementById('editorSheet').classList.remove('open');
    }

    /* ---- Supabase / storage ---- */
    function ensureSupabase() {
      if (sbClient) return sbClient;
      if (typeof window.supabase === 'undefined' || !window.supabase.createClient) return null;
      sbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      return sbClient;
    }

    function applyStateObject(obj) {
      if (!obj) return;
      state.notes = obj.notes || [];
      state.folders = obj.folders || [];
      state.activeFolderId = obj.activeFolderId || 'all';
      state.activeNoteId = obj.activeNoteId || null;
      state.theme = obj.theme || 'dark';
      state.isWordWrap = obj.isWordWrap !== undefined ? obj.isWordWrap : true;
      state.notes.forEach(n => { if (n.folderId === undefined) n.folderId = null; });
    }

    function loadLocalState() {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (!saved) return false;
      try {
        applyStateObject(JSON.parse(saved));
        return true;
      } catch (e) {
        console.error(e);
        return false;
      }
    }

    function saveLocalState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (e) {
        console.error(e);
      }
    }

    function updateSaveStatus(text) {
      if (saveStatusEl) saveStatusEl.textContent = text;
    }

    async function pullFromCloud() {
      const client = ensureSupabase();
      if (!client) return null;
      try {
        const { data, error } = await client
          .from('notepad_data')
          .select('data, updated_at')
          .eq('id', DATA_ROW_ID)
          .maybeSingle();
        if (error) {
          console.warn(error.message);
          return null;
        }
        if (!data) return null;
        lastCloudUpdatedAt = data.updated_at;
        return data;
      } catch (e) {
        console.warn(e);
        return null;
      }
    }

    async function pushToCloud() {
      const client = ensureSupabase();
      if (!client || !isOnline) return false;
      if (isSyncing) return false;
      isSyncing = true;
      try {
        const payload = {
          id: DATA_ROW_ID,
          data: state,
          updated_at: new Date().toISOString()
        };
        const { error } = await client
          .from('notepad_data')
          .upsert(payload, { onConflict: 'id' });
        if (error) {
          updateSaveStatus('本地已儲存（雲端失敗）');
          return false;
        }
        lastCloudUpdatedAt = payload.updated_at;
        updateSaveStatus('已同步雲端');
        return true;
      } catch (e) {
        updateSaveStatus('本地已儲存（離線）');
        return false;
      } finally {
        isSyncing = false;
      }
    }

    function scheduleCloudSave() {
      clearTimeout(cloudSaveTimer);
      cloudSaveTimer = setTimeout(() => { pushToCloud(); }, 700);
    }

    function persistData() {
      clearTimeout(localSaveTimer);
      localSaveTimer = setTimeout(() => saveLocalState(), 1000);
      if (isOnline) scheduleCloudSave();
      else updateSaveStatus('本地暫存（離線）');
    }

    function subscribeRealtime() {
      const client = ensureSupabase();
      if (!client) return;
      if (realtimeChannel) {
        try { client.removeChannel(realtimeChannel); } catch (_) {}
      }
      realtimeChannel = client
        .channel('notepad_main')
        .on('postgres_changes', {
          event: '*',
          schema: 'public',
          table: 'notepad_data',
          filter: 'id=eq.' + DATA_ROW_ID
        }, (payload) => {
          const row = payload.new;
          if (!row || !row.data) return;
          if (row.updated_at && lastCloudUpdatedAt && row.updated_at === lastCloudUpdatedAt) return;
          lastCloudUpdatedAt = row.updated_at;

          const ae = document.activeElement;
          const editingTitle = ae === noteTitleInput;
          const editingBody = editor && (ae === editor || editor.contains(ae));

          if (editingTitle || editingBody) {
            const keepId = state.activeNoteId;
            const keepTitle = noteTitleInput ? noteTitleInput.value : '';
            const keepContent = editor ? editor.innerHTML : '';
            applyStateObject(row.data);
            state.activeNoteId = keepId;
            const active = state.notes.find(n => n.id === keepId);
            if (active) {
              active.title = keepTitle || active.title;
              active.content = keepContent;
            } else if (keepId) {
              state.notes.unshift({
                id: keepId,
                title: keepTitle || '新筆記',
                content: keepContent,
                pinned: false,
                folderId: null,
                lastSaved: new Date().toISOString()
              });
            }
            saveLocalState();
            if (!noteSearchInput.value.trim()) renderList();
            updateSaveStatus('已同步雲端');
            return;
          }

          applyStateObject(row.data);
          saveLocalState();
          renderFromState();
          updateSaveStatus('已從雲端更新');
          showToast('已從雲端同步');
        })
        .subscribe();
    }

    function setupOnlineListeners() {
      window.addEventListener('online', async () => {
        isOnline = true;
        updateSaveStatus('連線中…');
        await pushToCloud();
        subscribeRealtime();
      });
      window.addEventListener('offline', () => {
        isOnline = false;
        updateSaveStatus('離線（僅本地）');
      });
    }

    /* ---- Theme ---- */
    function toggleTheme() {
      state.theme = state.theme === 'dark' ? 'light' : 'dark';
      applyTheme(state.theme);
      persistData();
    }
    function applyTheme(theme) {
      const moon = '<path d="M233.54,142.23a8,8,0,0,0-8-8.18,90,90,0,0,1-74.1-74.1,8,8,0,0,0-8.18-8,106,106,0,1,0,90.28,90.28Z"></path>';
      const sun = '<path d="M128,40a96,96,0,1,0,96,96A96.11,96.11,0,0,0,128,40Zm0,176a80,80,0,1,1,80-80A80.09,80.09,0,0,1,128,216Z"></path>';
      const icon = document.getElementById('themeIcon');
      if (theme === 'dark') {
        document.documentElement.classList.add('dark');
        if (icon) icon.innerHTML = moon;
        const meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', '#0f172a');
      } else {
        document.documentElement.classList.remove('dark');
        if (icon) icon.innerHTML = sun;
        const meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', '#f8fafc');
      }
    }

    /* ---- Folders & list ---- */
    function ensureFolders() {
      if (!Array.isArray(state.folders)) state.folders = [];
      if (!state.activeFolderId) state.activeFolderId = 'all';
    }

    function escapeHTML(str) {
      return String(str).replace(/[&<>'"]/g, t => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
      }[t] || t));
    }
    function escapeRegExp(s) {
      return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    }
    function formatDate(isoStr) {
      if (!isoStr) return '';
      const date = new Date(isoStr);
      const now = new Date();
      if (date.toDateString() === now.toDateString()) {
        return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      }
      return (date.getMonth() + 1) + '/' + date.getDate() + ' ' +
        date.getHours() + ':' + (date.getMinutes() < 10 ? '0' : '') + date.getMinutes();
    }

    function renderFolders() {
      ensureFolders();
      const el = document.getElementById('folderList');
      if (!el) return;
      const counts = { all: state.notes.length, uncategorized: 0 };
      state.folders.forEach(f => { counts[f.id] = 0; });
      state.notes.forEach(n => {
        if (!n.folderId) counts.uncategorized++;
        else if (counts[n.folderId] !== undefined) counts[n.folderId]++;
        else counts.uncategorized++;
      });

      const parts = [];
      const chip = (id, label, count) => {
        const active = state.activeFolderId === id;
        return `<button type="button" class="chip ${active ? 'active' : ''}" onclick="selectFolder('${id}')">
          <span>${escapeHTML(label)}</span><span class="opacity-70">${count}</span>
        </button>`;
      };
      parts.push(chip('all', '全部', counts.all));
      parts.push(chip('uncategorized', '未分類', counts.uncategorized));
      state.folders.forEach(f => {
        parts.push(`<button type="button" class="chip ${state.activeFolderId === f.id ? 'active' : ''}" onclick="selectFolder('${f.id}')">
          <span>${escapeHTML(f.name)}</span><span class="opacity-70">${counts[f.id] || 0}</span>
          <span onclick="event.stopPropagation();renameFolder('${f.id}')" class="opacity-80">✎</span>
          <span onclick="event.stopPropagation();deleteFolder('${f.id}')" class="text-red-400">×</span>
        </button>`);
      });
      el.innerHTML = parts.join('');
    }

    function selectFolder(id) {
      state.activeFolderId = id;
      renderList();
      persistData();
    }
    function createFolder() {
      ensureFolders();
      const name = prompt('資料夾名稱：');
      if (!name || !name.trim()) return;
      const folder = {
        id: 'folder_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
        name: name.trim(),
        createdAt: new Date().toISOString()
      };
      state.folders.push(folder);
      state.activeFolderId = folder.id;
      renderList();
      persistData();
      showToast('已建立「' + folder.name + '」');
    }
    function renameFolder(folderId) {
      const folder = state.folders.find(f => f.id === folderId);
      if (!folder) return;
      const name = prompt('重新命名：', folder.name);
      if (!name || !name.trim() || name.trim() === folder.name) return;
      folder.name = name.trim();
      renderList();
      persistData();
    }
    function deleteFolder(folderId) {
      const folder = state.folders.find(f => f.id === folderId);
      if (!folder) return;
      if (!confirm('刪除資料夾「' + folder.name + '」？筆記會移到未分類。')) return;
      state.notes.forEach(n => { if (n.folderId === folderId) n.folderId = null; });
      state.folders = state.folders.filter(f => f.id !== folderId);
      if (state.activeFolderId === folderId) state.activeFolderId = 'all';
      renderList();
      persistData();
    }

    function renderList() {
      ensureFolders();
      renderFolders();
      notesListEl.innerHTML = '';
      const q = (noteSearchInput.value || '').toLowerCase().trim();

      let filtered = state.notes.filter(note => {
        if (state.activeFolderId === 'uncategorized') {
          if (note.folderId) return false;
        } else if (state.activeFolderId && state.activeFolderId !== 'all') {
          if (note.folderId !== state.activeFolderId) return false;
        }
        if (!q) return true;
        const titleMatch = (note.title || '').toLowerCase().includes(q);
        const tmp = document.createElement('div');
        tmp.innerHTML = note.content || '';
        const text = (tmp.textContent || '').toLowerCase();
        return titleMatch || text.includes(q);
      });

      filtered.sort((a, b) => (b.pinned ? 1 : 0) - (a.pinned ? 1 : 0));

      if (!filtered.length) {
        notesListEl.innerHTML = '<div class="text-center text-slate-400 text-sm py-12">尚無筆記</div>';
        return;
      }

      filtered.forEach(note => {
        const isActive = note.id === state.activeNoteId;
        const folderName = note.folderId
          ? ((state.folders.find(f => f.id === note.folderId) || {}).name || '')
          : '';
        const el = document.createElement('div');
        el.className = 'note-card' + (isActive ? ' active' : '');
        el.onclick = () => openNote(note.id);

        let snippet = '';
        if (q) {
          const tmp = document.createElement('div');
          tmp.innerHTML = note.content || '';
          const plain = (tmp.textContent || '').replace(/\s+/g, ' ').trim();
          const idx = plain.toLowerCase().indexOf(q);
          if (idx >= 0) {
            const start = Math.max(0, idx - 12);
            const end = Math.min(plain.length, idx + q.length + 20);
            snippet = (start > 0 ? '…' : '') + plain.slice(start, end) + (end < plain.length ? '…' : '');
          }
        }

        el.innerHTML = `
          <div class="min-w-0 flex-1 pr-1">
            <div class="text-sm font-medium truncate flex items-center gap-1 ${isActive ? 'text-blue-600 dark:text-blue-400' : ''}">
              ${note.pinned ? '<span class="text-amber-500 shrink-0">📌</span>' : ''}
              ${escapeHTML(note.title || '無標題')}
            </div>
            <div class="text-xs text-slate-400 mt-0.5 truncate">
              ${folderName ? '<span class="text-blue-500/80">' + escapeHTML(folderName) + '</span> · ' : ''}${formatDate(note.lastSaved)}
            </div>
            ${snippet ? '<div class="text-[11px] text-slate-500 mt-0.5 line-clamp-2">' + escapeHTML(snippet) + '</div>' : ''}
          </div>
          <div class="actions">
            <button type="button" class="hit text-slate-400" title="置頂" onclick="togglePinNote('${note.id}', event)">${note.pinned ? '📌' : '📍'}</button>
            <button type="button" class="hit text-slate-400" title="刪除" onclick="requestDeleteNote('${note.id}', event)">🗑</button>
          </div>`;
        notesListEl.appendChild(el);
      });
    }

    let _listTimer = null;
    function debouncedRenderList() {
      clearTimeout(_listTimer);
      _listTimer = setTimeout(renderList, 160);
    }

    function openNote(noteId) {
      if (state.activeNoteId && state.activeNoteId !== noteId) {
        saveCurrentNoteState();
      }
      state.activeNoteId = noteId;
      loadActiveNote();
      renderList();
      showEditorView();
    }

    function createNewNote(shouldFocus) {
      const newNote = {
        id: 'note_' + Date.now() + '_' + Math.random().toString(36).slice(2, 7),
        title: '新筆記',
        content: '',
        pinned: false,
        folderId: (state.activeFolderId && state.activeFolderId !== 'all' && state.activeFolderId !== 'uncategorized')
          ? state.activeFolderId : null,
        lastSaved: new Date().toISOString()
      };
      if (noteSearchInput.value) noteSearchInput.value = '';
      state.notes.unshift(newNote);
      state.activeNoteId = newNote.id;
      renderList();
      loadActiveNote();
      persistData();
      showEditorView();
      if (shouldFocus) {
        setTimeout(() => {
          noteTitleInput.focus();
          noteTitleInput.select();
        }, 80);
      }
    }

    function togglePinNote(noteId, event) {
      if (event) event.stopPropagation();
      const note = state.notes.find(n => n.id === noteId);
      if (!note) return;
      note.pinned = !note.pinned;
      renderList();
      persistData();
      showToast(note.pinned ? '已置頂' : '已取消置頂');
    }
    function togglePinActive() {
      if (state.activeNoteId) togglePinNote(state.activeNoteId);
    }

    function moveActiveNoteFolder() {
      if (!state.activeNoteId) return;
      moveNoteToFolder(state.activeNoteId);
    }
    function moveNoteToFolder(noteId, event) {
      if (event) event.stopPropagation();
      ensureFolders();
      const note = state.notes.find(n => n.id === noteId);
      if (!note) return;
      if (!state.folders.length) {
        if (confirm('目前沒有資料夾，要建立嗎？')) createFolder();
        return;
      }
      const list = state.folders.map((f, i) => (i + 1) + '. ' + f.name).join('\n');
      const ans = prompt('移到哪個資料夾？\n0. 未分類\n' + list + '\n\n輸入編號：');
      if (ans === null) return;
      const num = parseInt(ans, 10);
      if (isNaN(num) || num < 0 || num > state.folders.length) {
        showToast('無效編號');
        return;
      }
      note.folderId = num === 0 ? null : state.folders[num - 1].id;
      renderList();
      persistData();
      showToast('已移動');
    }

    function requestDeleteNote(noteId, event) {
      if (event) event.stopPropagation();
      noteToDeleteId = noteId;
      document.getElementById('deleteConfirmModal').classList.add('open');
    }
    function requestDeleteActive() {
      if (state.activeNoteId) requestDeleteNote(state.activeNoteId);
    }
    function closeDeleteConfirmModal() {
      document.getElementById('deleteConfirmModal').classList.remove('open');
      noteToDeleteId = null;
    }
    function confirmDeleteNote() {
      if (!noteToDeleteId) return;
      const index = state.notes.findIndex(n => n.id === noteToDeleteId);
      if (index < 0) return;
      lastDeletedNote = JSON.parse(JSON.stringify(state.notes[index]));
      lastDeletedNoteIndex = index;
      state.notes.splice(index, 1);
      if (!state.notes.length) {
        createNewNote(false);
      } else if (state.activeNoteId === noteToDeleteId) {
        state.activeNoteId = state.notes[0].id;
        loadActiveNote();
        if (isMobileLayout()) showListView();
      }
      renderList();
      persistData();
      closeDeleteConfirmModal();
      showUndoToast();
    }
    function showUndoToast() {
      const container = document.getElementById('toastContainer');

    function undoDelete() {

      const insertIndex = Math.min(Math.max(0, lastDeletedNoteIndex), state.notes.length);
      state.notes.splice(insertIndex, 0, lastDeletedNote);
      state.activeNoteId = lastDeletedNote.id;

    function handleChecklistKeydown(e) {
      const textEl = e.target;
      const item = textEl.closest('.checklist-item');
      if (!item) return;
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        const tmp = document.createElement('div');
        tmp.innerHTML = createChecklistItemHTML('');
        const newItem = tmp.firstElementChild;
        item.after(newItem);
        const nt = newItem.querySelector('.checklist-text');
        if (nt) nt.focus();
        handleEditorInput();
      }
      if (e.key === 'Backspace' && !(textEl.textContent || '').length) {
        e.preventDefault();
        const prev = item.previousElementSibling;
        item.remove();
        if (prev && prev.classList.contains('checklist-item')) {
          const pt = prev.querySelector('.checklist-text');
          if (pt) pt.focus();

    function handlePaste(e) {
      const items = (e.clipboardData || e.originalEvent.clipboardData).items;
      for (let item of items) {
        if (item.type.indexOf('image') === 0) {
          e.preventDefault();
          compressAndInsertImage(item.getAsFile());
          return;
        }
      }
      e.preventDefault();
      const html = (e.clipboardData || window.clipboardData).getData('text/html');
      const text = (e.clipboardData || window.clipboardData).getData('text');
      if (html) {
        const temp = document.createElement('div');
        temp.innerHTML = html;
        temp.querySelectorAll('script,style,meta,link,iframe,object,noscript').forEach(el => el.remove());
        const keep = new Set(['style','color','face','size','href','target','src','alt','bgcolor','align','checked','type','class']);
        const all = temp.getElementsByTagName('*');
        for (let i = all.length - 1; i >= 0; i--) {
          const el = all[i];
          [...el.attributes].forEach(attr => {
            const name = attr.name.toLowerCase();
            if (name.startsWith('on') || name === 'contenteditable') el.removeAttribute(attr.name);
            else if (!keep.has(name)) el.removeAttribute(attr.name);
          });
          if (el.tagName === 'A') {
            el.setAttribute('target', '_blank');
            el.setAttribute('rel', 'noopener noreferrer');
          }
        }
        document.execCommand('insertHTML', false, temp.innerHTML);
      } else if (/^https?:\/\/\S+$/i.test(text.trim())) {
        document.execCommand('insertHTML', false, '<a href="' + text.trim() + '" target="_blank">' + escapeHTML(text.trim()) + '</a>');
      } else {
        document.execCommand('insertText', false, text);
      }
      handleEditorInput();
    }

    function handleImageUpload(e) {

    function compressAndInsertImage(file) {
      const reader = new FileReader();
      reader.onload = function (ev) {
        const img = new Image();
        img.onload = function () {
          const canvas = document.createElement('canvas');
          let w = img.width, h = img.height;
          const maxDim = 1200;
          if (w > maxDim || h > maxDim) {
            if (w > h) { h = Math.round(h * maxDim / w); w = maxDim; }
            else { w = Math.round(w * maxDim / h); h = maxDim; }
          }
          canvas.width = w; canvas.height = h;
          const ctx = canvas.getContext('2d');
          const preferPng = /png|webp|gif/i.test(file.type || '');
          if (!preferPng) {
            ctx.fillStyle = '#fff';
            ctx.fillRect(0, 0, w, h);
          }
          ctx.drawImage(img, 0, 0, w, h);
          const dataUrl = preferPng ? canvas.toDataURL('image/png') : canvas.toDataURL('image/jpeg', 0.8);
          document.execCommand('insertHTML', false, '<img src="' + dataUrl + '" alt="image">');
          handleEditorInput();
          showToast('已插入圖片');
        };
        img.src = ev.target.result;
      };
      reader.readAsDataURL(file);
    }

    function selectImage(imgEl) {

      const cRect = editorContainer.getBoundingClientRect();
      const overlayW = Math.min(280, editorContainer.clientWidth - 8);
      let top = imgRect.top - cRect.top + editorContainer.scrollTop - 44;
      let left = imgRect.left - cRect.left + editorContainer.scrollLeft;
      if (imgRect.top - cRect.top < 48) {
        top = imgRect.bottom - cRect.top + editorContainer.scrollTop + 6;
      }
      left = Math.max(4, Math.min(left, editorContainer.clientWidth - overlayW - 4));
      top = Math.max(0, top);
      imgResizeOverlay.style.top = top + 'px';
      imgResizeOverlay.style.left = left + 'px';
      imgResizeOverlay.style.maxWidth = overlayW + 'px';
      imgResizeOverlay.style.display = 'flex';
    }

    /* ---- Search ---- */
    function openSearchModal() {
      document.getElementById('searchModal').classList.add('open');
      document.getElementById('searchInput').focus();
    }
    function closeSearchModal() {
      document.getElementById('searchModal').classList.remove('open');
    }
    function _getTextNodes(root) {
      const nodes = [];
      const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
        acceptNode(node) {
          const p = node.parentElement;
          if (!p || p.tagName === 'SCRIPT' || p.tagName === 'STYLE') return NodeFilter.FILTER_REJECT;
          return NodeFilter.FILTER_ACCEPT;
        }
      });
      let n;
      while ((n = walker.nextNode())) nodes.push(n);
      return nodes;
    }
    function _findNextInEditor(query, fromRange) {
      if (!query) return null;
      const q = query.toLowerCase();
      const nodes = _getTextNodes(editor);
      let startNode = null, startOffset = 0;
      if (fromRange) {
        startNode = fromRange.endContainer;
        startOffset = fromRange.endOffset;
        if (startNode.nodeType !== Node.TEXT_NODE) {
          startNode = null;
          startOffset = 0;
        }
      }
      let passed = !startNode;
      for (const node of nodes) {
        if (!passed) {
          if (node === startNode) {
            passed = true;
            const text = node.nodeValue || '';
            const idx = text.toLowerCase().indexOf(q, startOffset);
            if (idx !== -1) {
              const range = document.createRange();
              range.setStart(node, idx);
              range.setEnd(node, idx + query.length);
              return range;
            }
          }
          continue;
        }
        const text = node.nodeValue || '';
        const idx = text.toLowerCase().indexOf(q);
        if (idx !== -1) {
          const range = document.createRange();
          range.setStart(node, idx);
          range.setEnd(node, idx + query.length);
          return range;
        }
      }
      if (fromRange) {
        for (const node of nodes) {
          const text = node.nodeValue || '';
          const idx = text.toLowerCase().indexOf(q);
          if (idx !== -1) {
            const range = document.createRange();
            range.setStart(node, idx);
            range.setEnd(node, idx + query.length);
            return range;
          }
        }
      }
      return null;
    }
    function performSearchNext() {
      const query = document.getElementById('searchInput').value;
      if (!query) return;
      const range = _findNextInEditor(query, _lastFindRange);
      if (range) {
        const sel = window.getSelection();
        sel.removeAllRanges();
        sel.addRange(range);
        _lastFindRange = range;
        try { range.startContainer.parentElement?.scrollIntoView({ block: 'center', behavior: 'smooth' }); } catch (_) {}
        document.getElementById('searchResults').textContent = '找到';
      } else {
        _lastFindRange = null;
        document.getElementById('searchResults').textContent = '查無結果';
      }
    }
    function performReplace() {
      const searchVal = document.getElementById('searchInput').value;
      const replaceVal = document.getElementById('replaceInput').value;
      if (!searchVal) return;
      const sel = window.getSelection();
      if (sel && sel.rangeCount && sel.toString().toLowerCase() === searchVal.toLowerCase()) {
        document.execCommand('insertText', false, replaceVal);
        _lastFindRange = null;
        performSearchNext();
      } else performSearchNext();
      handleEditorInput();
    }
    function performReplaceAll() {
      const searchVal = document.getElementById('searchInput').value;
      const replaceVal = document.getElementById('replaceInput').value;
      if (!searchVal) return;
      const nodes = _getTextNodes(editor);
      const qLower = searchVal.toLowerCase();
      let count = 0;
      for (let i = nodes.length - 1; i >= 0; i--) {
        const node = nodes[i];
        const text = node.nodeValue || '';
        if (!text.toLowerCase().includes(qLower)) continue;
        let result = '', pos = 0;
        const lower = text.toLowerCase();
        let idx;
        while ((idx = lower.indexOf(qLower, pos)) !== -1) {
          result += text.slice(pos, idx) + replaceVal;
          pos = idx + searchVal.length;
          count++;
        }
        result += text.slice(pos);
        node.nodeValue = result;
      }
      _lastFindRange = null;
      handleEditorInput();
      document.getElementById('searchResults').textContent = count ? '已取代 ' + count + ' 處' : '查無結果';
      showToast(count ? '已取代 ' + count + ' 處' : '查無結果');
    }

    function loadScript(src) {
      return new Promise((resolve, reject) => {
        if (document.querySelector('script[src="' + src + '"]')) { resolve(); return; }
        const s = document.createElement('script');
        s.src = src;
        s.onload = () => resolve();
        s.onerror = () => reject(new Error('load fail ' + src));
        document.head.appendChild(s);
      });
    }
    async function exportCurrentNotePDF() {
      closeExportModal();
      saveCurrentNoteState();
      const active = state.notes.find(n => n.id === state.activeNoteId);
      if (!active) return;
      const title = (noteTitleInput.value || active.title || '無標題').trim();
      const plain = (editor.textContent || '').replace(/\s+/g, ' ').trim();
      if (!plain) {
        showToast('沒有內容');
        return;
      }
      showToast('產生 PDF…');
      try {
        await loadScript('https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js');
        const { jsPDF } = window.jspdf;
        const pdf = new jsPDF({ unit: 'mm', format: 'a4' });
        pdf.setFont('helvetica', 'normal');
        pdf.setFontSize(16);
        pdf.text(title, 15, 20);
        pdf.setFontSize(11);
        const lines = pdf.splitTextToSize(plain, 180);
        let y = 32;
        lines.forEach(line => {
          if (y > 280) { pdf.addPage(); y = 20; }
          pdf.text(line, 15, y);
          y += 6;
        });
        const safe = title.replace(/[\\/:*?"<>|]/g, '_').slice(0, 40) || 'note';
        pdf.save(safe + '.pdf');
        showToast('PDF 已下載');
      } catch (err) {
        console.error(err);
        showToast('PDF 失敗');
      }
    }
    function handleImport(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function (e) {
        try {
          const data = JSON.parse(e.target.result);
          const hasNotes = data.notes && Array.isArray(data.notes);
          if (hasNotes) {
            let mode = 'overwrite';
            if (state.notes.length > 0) {
              const choice = confirm(
                '匯入 ' + data.notes.length + ' 則，目前 ' + state.notes.length + ' 則。\n確定＝合併，取消＝再問是否覆蓋'
              );
              if (choice) mode = 'merge';
              else {
                if (!confirm('要完全覆蓋嗎？')) {
                  showToast('已取消');
                  event.target.value = '';
                  return;
                }
                mode = 'overwrite';
              }
            }
            if (mode === 'overwrite') {
              state.notes = data.notes;
              state.notes.forEach(n => { if (n.folderId === undefined) n.folderId = null; });
              if (Array.isArray(data.folders)) state.folders = data.folders;
              if (data.activeFolderId) state.activeFolderId = data.activeFolderId;
            } else {
              const map = new Map(state.notes.map(n => [n.id, n]));
              data.notes.forEach(n => {
                if (n.folderId === undefined) n.folderId = null;
                map.set(n.id, n);
              });
              state.notes = Array.from(map.values());
              if (Array.isArray(data.folders)) {
                const fmap = new Map((state.folders || []).map(f => [f.id, f]));
                data.folders.forEach(f => fmap.set(f.id, f));
                state.folders = Array.from(fmap.values());
              }
            }
            if (state.notes.length) state.activeNoteId = state.notes[0].id;
            renderFromState();
            persistData();
            showToast(mode === 'merge' ? '已合併匯入' : '已覆蓋匯入');
          } else if (data.content !== undefined) {
            state.notes.unshift({
              id: 'note_' + Date.now(),
              title: data.title || '匯入筆記',
              content: data.content || '',
              folderId: null,
              lastSaved: data.lastSaved || new Date().toISOString()
            });
            state.activeNoteId = state.notes[0].id;
            renderFromState();
            persistData();
            showToast('已匯入');
          } else showToast('格式不符');
        } catch (err) {
          showToast('匯入失敗');
        }
      };
      reader.readAsText(file, 'UTF-8');
      event.target.value = '';
    }

    function showToast(msg) {
      const container = document.getElementById('toastContainer');
      const toast = document.createElement('div');
      toast.className = 'toast';
      toast.textContent = msg;
      container.appendChild(toast);
      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transition = 'opacity .3s';
        setTimeout(() => toast.remove(), 300);
      }, 2200);
    }

    function renderFromState() {
      applyTheme(state.theme);
      if (!state.notes || !state.notes.length) {
        createNewNote(false);
        if (isMobileLayout()) showListView();
      } else {
        if (!state.activeNoteId || !state.notes.find(n => n.id === state.activeNoteId)) {
          state.activeNoteId = state.notes[0].id;
        }
        renderList();
        loadActiveNote();
        if (isMobileLayout()) showListView();
        else showEditorView();
      }
    }

    function setupEditorEvents() {
      editor.addEventListener('click', function (e) {
        const link = e.target.closest('a');
        if (link && link.href) {
          e.preventDefault();
          window.open(link.href, '_blank', 'noopener,noreferrer');
          return;
        }
        if (e.target.tagName === 'IMG') selectImage(e.target);
        else hideImageResizeOverlay();
      });
      document.addEventListener('click', function (e) {
        if (!editor.contains(e.target) && !imgResizeOverlay.contains(e.target)) {
          hideImageResizeOverlay();
        }
      });
    }

    /* Keyboard / viewport */
    function setupVisualViewport() {
      const root = document.documentElement;
      const apply = () => {
        const vv = window.visualViewport;
        if (!vv) return;
        const h = vv.height;
        root.style.setProperty('--app-vh', h + 'px');
        const kb = Math.max(0, window.innerHeight - vv.height - vv.offsetTop);
        root.style.setProperty('--kb', kb + 'px');
      };
      if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', apply);
        window.visualViewport.addEventListener('scroll', apply);
      }
      window.addEventListener('resize', apply);
      apply();
    }

    function registerSW() {
      if (!('serviceWorker' in navigator)) return;
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    }

    async function initApp() {
      ensureSupabase();
      setupOnlineListeners();
      setupEditorEvents();
      setupVisualViewport();
      registerSW();

      if (window.PRELOADED_STATE) {
        applyStateObject(window.PRELOADED_STATE);
        saveLocalState();
        renderFromState();
        if (isOnline) await pushToCloud();
        subscribeRealtime();
        return;
      }

      updateSaveStatus('載入中…');
      if (isOnline && ensureSupabase()) {
        const remote = await pullFromCloud();
        if (remote && remote.data) {
          applyStateObject(remote.data);
          saveLocalState();
          renderFromState();
          updateSaveStatus('已從雲端載入');
        } else {
          loadLocalState();
          renderFromState();
          await pushToCloud();
        }
        subscribeRealtime();
      } else {
        loadLocalState();
        renderFromState();
        updateSaveStatus('離線（僅本地）');
      }
    }

    // expose for inline handlers
    window.selectFolder = selectFolder;
    window.createFolder = createFolder;
    window.renameFolder = renameFolder;
    window.deleteFolder = deleteFolder;
    window.createNewNote = createNewNote;
    window.toggleTheme = toggleTheme;
    window.togglePinNote = togglePinNote;
    window.togglePinActive = togglePinActive;
    window.moveActiveNoteFolder = moveActiveNoteFolder;
    window.moveNoteToFolder = moveNoteToFolder;
    window.requestDeleteNote = requestDeleteNote;
    window.requestDeleteActive = requestDeleteActive;
    window.closeDeleteConfirmModal = closeDeleteConfirmModal;
    window.confirmDeleteNote = confirmDeleteNote;
    window.undoDelete = undoDelete;
    window.showListView = showListView;
    window.openEditorMenu = openEditorMenu;
    window.closeSheets = closeSheets;
    window.formatText = formatText;
    window.formatColor = formatColor;
    window.changeFontSize = changeFontSize;
    window.insertChecklist = insertChecklist;
    window.toggleChecklistItem = toggleChecklistItem;
    window.handleChecklistKeydown = handleChecklistKeydown;
    window.openLinkModal = openLinkModal;
    window.closeLinkModal = closeLinkModal;
    window.confirmInsertLink = confirmInsertLink;
    window.handlePaste = handlePaste;
    window.handleImageUpload = handleImageUpload;
    window.handleEditorInput = handleEditorInput;
    window.handleTitleInput = handleTitleInput;
    window.resizeImage = resizeImage;
    window.removeSelectedImage = removeSelectedImage;
    window.clearCurrentNote = clearCurrentNote;
    window.undoClearNote = undoClearNote;
    window.openSearchModal = openSearchModal;
    window.closeSearchModal = closeSearchModal;
    window.performSearchNext = performSearchNext;
    window.performReplace = performReplace;
    window.performReplaceAll = performReplaceAll;
    window.openExportModal = openExportModal;
    window.closeExportModal = closeExportModal;
    window.exportJSON = exportJSON;
    window.exportHTML = exportHTML;
    window.exportCurrentNotePDF = exportCurrentNotePDF;
    window.handleImport = handleImport;
    window.debouncedRenderList = debouncedRenderList;

    window.addEventListener('load', () => {
      try { initApp(); }
      catch (e) {
        console.error(e);
        loadLocalState();
        renderFromState();
      }
    });

    // Android back: editor -> list
    window.addEventListener('popstate', () => {
      if (isMobileLayout() && document.body.classList.contains('mode-editor')) {
        showListView();
      }
    });
  })();
  </script>
</body>
</html>
